dependencies {
    api project(":rivr-core")
    api 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    api 'org.slf4j:slf4j-api:2.0.+'
   // api 'commons-fileupload2-jakarta:commons-fileupload2-jakarta:+'
    api 'jakarta.json:jakarta.json-api:2.1.3'
    implementation 'org.glassfish:jakarta.json:2.0.1'
    implementation 'org.apache.commons:commons-fileupload2-jakarta-servlet6:+' // Or the latest stable version
}

jar {
    manifest {
        attributes("Implementation-Title": "Rivr VoiceXML",
                   "Implementation-Version": rootProject.version,
                   "Implementation-Vendor": "Nu Echo Inc.")
    }
}

processResources {
    createVersionFile(sourceSets.main.output.resourcesDir, "com/nuecho/rivr/voicexml/version.properties");
}
